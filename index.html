    const firebaseConfig = {

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useCallback } = React;

    const ADMIN_PASSWORD = "2026";

    const INITIAL_WORKSHOPS = [
      { id:"w1",  name:"נוירופדגוגיה",  facilitator:"נוירופדגוגיה בקליק",            round:1, capacity:8, location:"יתעדכן", description:"איך להכין שיעור שהכיתה באמת לומדת בו - תוך 2 דקות? אפליקציה שמסייעת לתכנן שיעור עם עקרונות מבוססי חקר מוח. מעבירים: איציק וליטל", isLong:false, registeredCount:0 },
      { id:"w2",  name:"גיימינג",        facilitator:"מיינקראפט בכיתה",              round:1, capacity:8, location:"יתעדכן", description:"מיינקראפט בכיתה — איך הופכים בנייה ומשחק לחוויית למידה אמיתית? נתנסה במשחק שפיתחו התלמידים, נצפה בסרטון רפלקציה ונשוחח על חיבור משחק לאתגרי תלמידים. מעביר: שאהדי", isLong:false, registeredCount:0 },
      { id:"w3",  name:"מחנה משותף",     facilitator:"מדברים חופשי",                 round:1, capacity:8, location:"יתעדכן", description:"איך לקיים דיון נפיץ בכיתה? אפליקציה מארגנת של מתודות לבחירה שמאפשרות מרחב בטוח לדיון. מעבירים: אמילי, אביעד ושירן", isLong:false, registeredCount:0 },
      { id:"w4",  name:"שלומות המורים",  facilitator:"משוב מקדם",                    round:1, capacity:8, location:"יתעדכן", description:"איך לקיים קשר מטיב עם מורים בתהליך שנתי? סדנה על חשיבות צמתי הערכה בעבודת המורה - תהליך שנתי הכולל שיחת פתיחה, צפייה בשיעור, משוב והערכה מסכמת. מעביר: חן", isLong:false, registeredCount:0 },
      { id:"w5",  name:"פסיכופדגוגיה",   facilitator:"הקוביה",                       round:1, capacity:8, location:"יתעדכן", description:"איך מכניסים שיח רגשי, אייג'נסי והפסקות מוח לכיתה שרגילה לשבת בשקט ולהעתיק? ארגז הפעלות חווייתי ומובנה. מעבירים: בית אלחכמה", isLong:false, registeredCount:0 },
      { id:"w6",  name:"מדרש עברי",      facilitator:"מדרש עברי",                    round:1, capacity:8, location:"יתעדכן", description:"איך להפוך את הכיתה למרחב של סקרנות עצמאית? התנסות בפועל במתודה של בית מדרש כיתתי. מעבירים: שחר ואושרת. (סדנה ארוכה - שני סבבים)", isLong:true,  registeredCount:0 },
      { id:"w7",  name:"בינה מלאכותית", facilitator:"חבר לכתיבה",                   round:1, capacity:8, location:"יתעדכן", description:"איך לשפר את ההבעה בכתב של תלמידים שכמעט לא כותבים? אפליקציה לשיפור הכתיבה בכיתות יסוד — התלמיד בונה גיבור ודרמה, ה-AI מלווה את הכתיבה. מעבירה: גליה", isLong:false, registeredCount:0 },
      { id:"w8",  name:"נוירופדגוגיה",  facilitator:"CHECKIN365",                    round:2, capacity:8, location:"יתעדכן", description:"איך להתחיל כל שיעור בצ'ק אין רגשי שמסייע בוויסות רגשי? אפליקציה שעוזרת לפתוח שיעור עם צ'ק אין רגשי שמייצר שייכות. מעבירות: ורדה ורגינה", isLong:false, registeredCount:0 },
      { id:"w9",  name:"גיימינג",        facilitator:"מיינקראפט בכיתה",              round:2, capacity:8, location:"יתעדכן", description:"מיינקראפט בכיתה — איך הופכים בנייה ומשחק לחוויית למידה אמיתית? נתנסה במשחק שפיתחו התלמידים, נצפה בסרטון רפלקציה ונשוחח על חיבור משחק לאתגרי תלמידים. מעביר: שאהדי", isLong:false, registeredCount:0 },
      { id:"w10", name:"מחנה משותף",     facilitator:"מדברים חופשי",                 round:2, capacity:8, location:"יתעדכן", description:"איך לקיים דיון נפיץ בכיתה? אפליקציה מארגנת של מתודות לבחירה שמאפשרות מרחב בטוח לדיון. מעבירים: אמילי, אביעד ושירן", isLong:false, registeredCount:0 },
      { id:"w11", name:"שלומות המורים",  facilitator:"משוב מקדם",                    round:2, capacity:8, location:"יתעדכן", description:"איך לקיים קשר מטיב עם מורים בתהליך שנתי? סדנה על חשיבות צמתי הערכה בעבודת המורה - תהליך שנתי הכולל שיחת פתיחה, צפייה בשיעור, משוב והערכה מסכמת. מעביר: חן", isLong:false, registeredCount:0 },
      { id:"w12", name:"פסיכופדגוגיה",   facilitator:"ADHD נעים להכיר",              round:2, capacity:8, location:"יתעדכן", description:"איך לגרום לכיתה שלמה להבין מה חווה התלמיד עם ADHD מבפנים? סדנה חווייתית עם כלים פסיכופדגוגיים מעשיים להכלה והוראה מותאמת. מעבירה: אלאא אדריס", isLong:false, registeredCount:0 },
      { id:"w13", name:"נתיב חדש",       facilitator:"נתיב חדש (בערבית)",            round:2, capacity:8, location:"יתעדכן", description:"איך העבודה עם המוטיבציה יכולה להפחית את האלימות בכיתה? נכיר כלים מעשיים ליצירת מעורבות, תחושת הצלחה ושייכות. מעבירה: הנד רמוז", isLong:false, registeredCount:0 },
      { id:"w14", name:"בינה מלאכותית", facilitator:"אופק השותף למציאת חוזקות",      round:2, capacity:8, location:"יתעדכן", description:"אפליקציית AI לאיתור וטיפוח חוזקות אצל תלמידים", isLong:false, registeredCount:0 },
    ];

    const CAT_COLORS = {
      "נוירופדגוגיה":  "#8b5cf6",
      "גיימינג":        "#10b981",
      "מחנה משותף":    "#f59e0b",
      "שלומות המורים": "#ef4444",
      "פסיכופדגוגיה":  "#3b82f6",
      "מדרש עברי":      "#d97706",
      "בינה מלאכותית": "#ec4899",
      "נתיב חדש":       "#6366f1",
    };
    const getColor = (n) => CAT_COLORS[n] || "#a855f7";

    /* Sanitize name → safe firestore doc id */
    const safeId = (s) => s.replace(/[\s\/\\.#$\[\]]/g, "_");

    function App() {
      const [fbReady, setFbReady] = useState(!!(window.FB && window.FB.ready));
      const [view, setView] = useState("entry");
      const [firstName, setFirstName] = useState("");
      const [lastName, setLastName] = useState("");
      const [participant, setParticipant] = useState(null);
      const [workshops, setWorkshops] = useState([]);
      const [registrations, setRegistrations] = useState([]);
      const [loading, setLoading] = useState(true);
      const [adminPass, setAdminPass] = useState("");
      const [adminPassErr, setAdminPassErr] = useState(false);
      const [adminTab, setAdminTab] = useState("report");
      const [editing, setEditing] = useState(null);
      const [expanded, setExpanded] = useState(null);
      const [toast, setToast] = useState(null);
      const [saving, setSaving] = useState(false);
      const [pendingId, setPendingId] = useState(null);

      /* Wait for Firebase */
      useEffect(() => {
        if (fbReady) return;
        const h = () => setFbReady(true);
        window.addEventListener("firebase-ready", h);
        return () => window.removeEventListener("firebase-ready", h);
      }, [fbReady]);

      /* Subscribe to workshops + registrations */
      useEffect(() => {
        if (!fbReady) return;
        const { db, collection, onSnapshot, doc, setDoc, writeBatch, getDocs } = window.FB;

        // SEED DISABLED — workshops are authoritative in Firestore and must never
        // be overwritten by client code. If you ever need to re-seed from scratch,
        // do it manually with a dedicated tool, not on app load.
        // (Previous seed logic removed to prevent name reverts.)

        const unsubW = onSnapshot(collection(db, "workshops"), (snap) => {
          const ws = [];
          snap.forEach(d => ws.push({ ...d.data(), id: d.id }));
          ws.sort((a, b) => parseInt(a.id.replace("w","")) - parseInt(b.id.replace("w","")));
          setWorkshops(ws);
          setLoading(false);
        });
        const unsubR = onSnapshot(collection(db, "registrations"), (snap) => {
          const rs = [];
          snap.forEach(d => rs.push({ ...d.data(), id: d.id }));
          setRegistrations(rs);
        });
        return () => { unsubW(); unsubR(); };
      }, [fbReady]);

      const showToast = (msg, type = "ok") => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      };

      // Use the atomic counter on the workshop doc (the source of truth for capacity)
      const getCount = useCallback((wid) => {
        const ws = workshops.find(w => w.id === wid);
        return ws ? (ws.registeredCount || 0) : 0;
      }, [workshops]);
      const getReg = useCallback((name, round) => registrations.find(r => r.participantName === name && r.round === round), [registrations]);

      /* ── ACTIONS ── */
      const handleEntry = () => {
        if (!firstName.trim() || !lastName.trim()) { showToast("נא להזין שם ושם משפחה", "err"); return; }
        const name = (firstName.trim() + " " + lastName.trim());
        setParticipant({ name });
        const r1 = registrations.find(r => r.participantName === name && r.round === 1);
        setView(r1 ? "summary" : "round1");
      };

      const handleSelect = async (wid) => {
        if (saving) return; // ignore rapid double-clicks
        setPendingId(wid);   // immediate UI feedback before the transaction starts
        setSaving(true);
        try {
          const { db, doc, runTransaction } = window.FB;
          const name = participant.name;

          await runTransaction(db, async (txn) => {
            /* ─── READ PHASE ─── all reads must precede any writes ─── */
            const targetRef = doc(db, "workshops", wid);
            const targetSnap = await txn.get(targetRef);
            if (!targetSnap.exists()) throw new Error("NO_WS");
            const target = targetSnap.data();

            // Read existing registration for the round we're modifying
            const newRegRef = doc(db, "registrations", safeId(name) + "_r" + target.round);
            const existSnap = await txn.get(newRegRef);
            const exist = existSnap.exists() ? existSnap.data() : null;

            // Idempotent re-click on the same workshop
            if (exist && exist.workshopId === wid) return;

            // When acting on round 1 (whether the target is long or not), we also
            // need to know the user's round-2 registration to maintain consistency
            let r2RegRef = null, r2Reg = null;
            if (target.round === 1) {
              r2RegRef = doc(db, "registrations", safeId(name) + "_r2");
              const r2Snap = await txn.get(r2RegRef);
              r2Reg = r2Snap.exists() ? r2Snap.data() : null;
            }

            // Collect ids of workshops whose count must be decremented
            const oldWsIds = new Set();
            if (exist && exist.workshopId !== wid) oldWsIds.add(exist.workshopId);
            // If switching to a non-long r1 workshop and the user previously held a
            // long-workshop r2 registration, that long workshop also loses a slot.
            if (target.round === 1 && !target.isLong && r2Reg) {
              oldWsIds.add(r2Reg.workshopId);
            }

            // Read every old workshop's current state (Set guarantees no duplicates)
            const oldWs = {};
            for (const oldId of oldWsIds) {
              if (oldId === wid) continue;
              const oldRef = doc(db, "workshops", oldId);
              const oldSnap = await txn.get(oldRef);
              if (oldSnap.exists()) oldWs[oldId] = { ref: oldRef, data: oldSnap.data() };
            }

            /* ─── CAPACITY CHECK (atomic) ─── */
            const newCount = (target.registeredCount || 0) + 1;
            if (newCount > target.capacity) throw new Error("FULL");

            /* ─── WRITE PHASE ─── */
            // Bump the target workshop's count
            txn.update(targetRef, { registeredCount: newCount });

            // Decrement old workshops' counts
            for (const oldId in oldWs) {
              const { ref, data } = oldWs[oldId];
              txn.update(ref, { registeredCount: Math.max(0, (data.registeredCount || 0) - 1) });
            }

            // Write the registration for the current round
            txn.set(newRegRef, {
              participantName: name, workshopId: wid, round: target.round, timestamp: Date.now()
            });

            // Long workshop: also write a round-2 registration pointing to the same workshop
            if (target.isLong) {
              txn.set(r2RegRef, {
                participantName: name, workshopId: wid, round: 2, timestamp: Date.now()
              });
            } else if (target.round === 1 && r2Reg) {
              // Switching to non-long r1: if the previous r2 reg was from a long
              // workshop, it's now stale and must be deleted.
              const oldR2 = oldWs[r2Reg.workshopId];
              if (oldR2 && oldR2.data.isLong) {
                txn.delete(r2RegRef);
              }
            }
          });
        } catch (e) {
          if (e.message === "FULL") {
            showToast("הסדנא התמלאה זה עתה — בחרו אחרת", "err");
          } else if (e.message !== "NO_WS") {
            console.error(e);
            showToast("שגיאה בהרשמה. נסה שוב.", "err");
          }
        }
        setSaving(false);
        setPendingId(null);
      };

      const handleAdminLogin = () => {
        if (adminPass === ADMIN_PASSWORD) { setView("admin"); setAdminPassErr(false); }
        else setAdminPassErr(true);
      };

      const saveWorkshop = async (u) => {
        try {
          const { db, doc, setDoc } = window.FB;
          // Preserve the live registeredCount — the admin form does not touch it
          const existing = workshops.find(w => w.id === u.id);
          const safeUpdate = { ...u, registeredCount: existing ? (existing.registeredCount || 0) : 0 };
          await setDoc(doc(db, "workshops", u.id), safeUpdate);
          setEditing(null);
          showToast("הסדנא עודכנה ✓");
        } catch (e) {
          console.error(e);
          showToast("שגיאה בשמירה", "err");
        }
      };

      const exportCSV = () => {
        let csv = "\uFEFF" + "סדנא,מנחה,סבב,שם משתתף\n";
        workshops.forEach(w => {
          const ppl = registrations.filter(r => r.workshopId === w.id).map(r => r.participantName);
          if (!ppl.length) csv += '"' + w.name + '","' + w.facilitator + '","' + (w.round===1?"סבב א":"סבב ב") + '","—"\n';
          else ppl.forEach(p => { csv += '"' + w.name + '","' + w.facilitator + '","' + (w.round===1?"סבב א":"סבב ב") + '","' + p + '"\n'; });
        });
        const a = Object.assign(document.createElement("a"), {
          href: URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" })),
          download: "conference_report.csv"
        });
        a.click();
      };

      const resetAll = async () => {
        if (!confirm("למחוק את כל ההרשמות? פעולה זו אינה הפיכה.")) return;
        try {
          const { db, collection, getDocs, doc, writeBatch } = window.FB;
          const regSnap = await getDocs(collection(db, "registrations"));
          const wsSnap = await getDocs(collection(db, "workshops"));
          // One batch — atomic across regs + workshop counters
          const batch = writeBatch(db);
          regSnap.forEach(d => batch.delete(doc(db, "registrations", d.id)));
          wsSnap.forEach(d => batch.update(doc(db, "workshops", d.id), { registeredCount: 0 }));
          await batch.commit();
          showToast("כל ההרשמות נמחקו והקאונטרים אופסו");
        } catch (e) { console.error(e); showToast("שגיאה במחיקה", "err"); }
      };

      /* ── STYLES ── */
      const S = {
        root: { direction: "rtl", paddingBottom: 60, background: "#f5f6fb", minHeight: "100vh" },
        header: (color) => ({
          background: color || "#6850F0",
          color: "#fff", padding: "32px 26px 28px", textAlign: "center",
          borderRadius: 24, boxShadow: "0 10px 30px rgba(104,80,240,.22)",
          margin: "16px 12px 24px",
        }),
        card: { background: "#fff", borderRadius: 18, boxShadow: "0 4px 24px rgba(104,80,240,.08)", overflow: "hidden" },
        input: { width: "100%", padding: "13px 16px", border: "2px solid #e5e7eb", borderRadius: 12, fontSize: 15, direction: "rtl" },
        btn: (bg, fg = "#fff") => ({
          background: bg, color: fg, border: "none", borderRadius: 12,
          padding: "14px 28px", fontWeight: 700, fontSize: 15, cursor: "pointer", width: "100%",
        }),
        label: { display: "block", fontWeight: 600, fontSize: 13, color: "#374151", marginBottom: 6 },
        pill: (bg, fg) => ({ background: bg, color: fg, borderRadius: 20, padding: "3px 11px", fontSize: 12, fontWeight: 700 }),
        wrap: { maxWidth: 680, margin: "0 auto", padding: "0 16px" },
      };

      const Toast = () => toast ? (
        <div style={{
          position: "fixed", top: 18, left: "50%", transform: "translateX(-50%)",
          background: toast.type === "err" ? "#ef4444" : "#10b981",
          color: "#fff", padding: "12px 26px", borderRadius: 12, fontWeight: 700,
          zIndex: 9999, boxShadow: "0 6px 20px rgba(0,0,0,.18)", fontSize: 14, whiteSpace: "nowrap",
        }}>{toast.msg}</div>
      ) : null;

      if (!fbReady || loading) return (
        <div style={{ ...S.root, display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" }}>
          <div style={{ textAlign: "center", color: "#6850F0" }}>
            <div style={{ fontSize: 52 }}>✦</div>
            <p style={{ fontWeight: 600 }}>מתחבר לשרת…</p>
          </div>
        </div>
      );

      /* ═══ ENTRY ═══ */
      if (view === "entry") return (
        <div style={S.root}>
          <Toast />
          <div style={S.header()}>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 1.4, opacity: .85, marginBottom: 10 }}>חותם · רשת קהילות</div>
            <h1 style={{ margin: 0, fontSize: 30, fontWeight: 900, letterSpacing: -.5, lineHeight: 1.15 }}>
              אירוע סיום שנה<br/>רשת קהילות
            </h1>
            <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 8, justifyContent: "center" }}>
              <span style={{ fontSize: 18, color: "#FBC02D" }}>◀</span>
              <p style={{ margin: 0, fontSize: 16, fontWeight: 700 }}>סדנאות HOW TO – המגבר</p>
            </div>
          </div>
          <div style={S.wrap}>
            <div style={S.card}>
              <div style={{ padding: "32px 28px" }}>
                <div style={{ marginBottom: 18 }}>
                  <label style={S.label}>שם פרטי</label>
                  <input style={S.input} placeholder="הזן שם פרטי" value={firstName}
                    onChange={e => setFirstName(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && handleEntry()} />
                </div>
                <div style={{ marginBottom: 28 }}>
                  <label style={S.label}>שם משפחה</label>
                  <input style={S.input} placeholder="הזן שם משפחה" value={lastName}
                    onChange={e => setLastName(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && handleEntry()} />
                </div>
                <button style={S.btn("#6850F0")} onClick={handleEntry}>
                  כניסה ←
                </button>
                <div style={{ textAlign: "center", marginTop: 16 }}>
                  <button onClick={() => setView("adminLogin")}
                    style={{ background: "none", border: "none", color: "#9ca3af", cursor: "pointer", fontSize: 13 }}>
                    כניסת מנהל
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      /* ═══ ADMIN LOGIN ═══ */
      if (view === "adminLogin") return (
        <div style={S.root}>
          <Toast />
          <div style={S.header("linear-gradient(135deg,#1f2937,#374151)")}>
            <div style={{ fontSize: 40 }}>🔐</div>
            <h2 style={{ margin: "6px 0 0", fontWeight: 800 }}>כניסת מנהל</h2>
          </div>
          <div style={{ ...S.wrap, maxWidth: 420 }}>
            <div style={S.card}>
              <div style={{ padding: "32px 28px" }}>
                <label style={S.label}>סיסמא</label>
                <input type="password" style={{ ...S.input, marginBottom: 6, borderColor: adminPassErr ? "#ef4444" : "#e5e7eb" }}
                  placeholder="הזן סיסמא" value={adminPass}
                  onChange={e => { setAdminPass(e.target.value); setAdminPassErr(false); }}
                  onKeyDown={e => e.key === "Enter" && handleAdminLogin()} />
                {adminPassErr && <p style={{ color: "#ef4444", fontSize: 13, margin: "0 0 12px" }}>סיסמא שגויה</p>}
                <div style={{ height: adminPassErr ? 0 : 16 }} />
                <button style={S.btn("linear-gradient(135deg,#1f2937,#374151)")} onClick={handleAdminLogin}>כניסה</button>
                <div style={{ textAlign: "center", marginTop: 14 }}>
                  <button onClick={() => setView("entry")} style={{ background: "none", border: "none", color: "#9ca3af", cursor: "pointer", fontSize: 13 }}>← חזרה</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      /* ═══ ROUNDS ═══ */
      if (view === "round1" || view === "round2") {
        const round = view === "round1" ? 1 : 2;
        const roundWs = workshops.filter(w => w.round === round);
        const currentReg = participant ? getReg(participant.name, round) : null;
        const currentRegWs = currentReg ? workshops.find(w => w.id === currentReg.workshopId) : null;
        const isLongSelected = currentRegWs && currentRegWs.isLong;

        return (
          <div style={S.root}>
            <Toast />
            <div style={S.header()}>
              <p style={{ margin: "0 0 4px", fontSize: 13, opacity: .8 }}>
                שלום {participant && participant.name} · שלב {round} מתוך 2
              </p>
              <h2 style={{ margin: "0 0 14px", fontSize: 22, fontWeight: 800 }}>
                בחרו סדנא — סבב {round === 1 ? "א׳" : "ב׳"}
              </h2>
              <div style={{ background: "rgba(255,255,255,.25)", borderRadius: 6, height: 7, maxWidth: 260, margin: "0 auto" }}>
                <div style={{ background: "#fff", height: 7, borderRadius: 6, width: round === 1 ? "50%" : "100%", transition: "width .4s" }} />
              </div>
            </div>

            <div style={S.wrap}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(270px,1fr))", gap: 14 }}>
                {roundWs.map(ws => {
                  const count = getCount(ws.id);
                  const isFull = count >= ws.capacity;
                  const spots = ws.capacity - count;
                  const isPending = pendingId === ws.id;
                  const selected = isPending || (currentReg && currentReg.workshopId === ws.id);
                  const color = getColor(ws.name);
                  const otherPending = pendingId && !isPending;

                  return (
                    <div key={ws.id} className={"ws-card" + (isFull ? " ws-full" : "")}
                      onClick={() => !isFull && !saving && handleSelect(ws.id)}
                      style={{
                        background: "#fff", borderRadius: 16,
                        border: selected ? ("2.5px solid " + color) : isFull ? "2px solid #fecaca" : "2px solid #eaeafe",
                        cursor: isFull ? "not-allowed" : saving ? "wait" : "pointer", overflow: "hidden",
                        boxShadow: selected ? ("0 4px 18px " + color + "30") : "0 2px 12px rgba(0,0,0,.06)",
                        position: "relative",
                        opacity: otherPending ? 0.5 : 1,
                        transition: "opacity .15s, border-color .15s, box-shadow .15s",
                      }}>
                      <div style={{ background: selected ? color : isFull ? "#fca5a5" : color + "22", height: 6 }} />
                      {ws.isLong && (
                        <span style={{ position: "absolute", top: 14, left: 12, ...S.pill("#f59e0b22","#b45309"), fontSize: 11 }}>
                          ⏱ סבב ארוך
                        </span>
                      )}
                      <div style={{ padding: "16px 16px 18px" }}>
                        <div style={{ ...S.pill(color + "18", color), fontSize: 11, marginBottom: 8, display: "inline-block" }}>{ws.name}</div>
                        <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 700, color: "#1f2937" }}>{ws.facilitator}</h3>
                        {ws.description && <p style={{ margin: "0 0 8px", color: "#9ca3af", fontSize: 12 }}>{ws.description}</p>}
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14 }}>
                          <div style={{
                            padding: "8px 18px", borderRadius: 10,
                            background: isFull ? "#ef4444" : selected ? color : color + "18",
                            color: isFull || selected ? "#fff" : color,
                            fontWeight: 700, fontSize: 13,
                          }}>{isFull ? "🔴 מלאה" : isPending ? "מעבד…" : selected ? "✓ נבחרה" : "בחר"}</div>
                          <span style={{
                            fontSize: 12, fontWeight: 600,
                            color: isFull ? "#ef4444" : spots <= 2 ? "#f59e0b" : "#10b981",
                          }}>{isFull ? "אין מקום" : (spots + " מקומות")}</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Selection summary + Continue/Done button */}
              {currentReg && currentRegWs ? (
                <div style={{
                  marginTop: 26,
                  padding: 18,
                  background: "#fff",
                  borderRadius: 14,
                  border: "2px solid #38B6E0",
                  boxShadow: "0 4px 20px rgba(56,182,224,.18)",
                }}>
                  <div style={{ marginBottom: 14, textAlign: "center" }}>
                    <div style={{ fontSize: 12, color: "#0891b2", fontWeight: 700, marginBottom: 4 }}>
                      ✓ בחרת
                    </div>
                    <div style={{ fontSize: 15, color: "#1f2937", fontWeight: 700 }}>
                      {currentRegWs.name} — {currentRegWs.facilitator}
                    </div>
                    {isLongSelected && (
                      <div style={{ fontSize: 12, color: "#b45309", marginTop: 6 }}>
                        ⏱ סדנא ארוכה — מכסה את שני הסבבים
                      </div>
                    )}
                  </div>
                  <button
                    onClick={() => setView(round === 2 || isLongSelected ? "summary" : "round2")}
                    style={S.btn(round === 2 || isLongSelected ? "#38B6E0" : "#6850F0")}>
                    {round === 2 || isLongSelected ? "סיימתי — הצג סיכום ←" : "המשך לסבב ב׳ ←"}
                  </button>
                </div>
              ) : (
                <div style={{
                  marginTop: 26, padding: 14,
                  background: "#fffbeb",
                  border: "2px dashed #fbbf24",
                  borderRadius: 12, textAlign: "center",
                  color: "#92400e", fontSize: 14, fontWeight: 500,
                }}>
                  בחרו סדנא להמשך
                </div>
              )}

              <div style={{ textAlign: "center", marginTop: 20 }}>
                <button onClick={() => setView(round === 1 ? "entry" : "round1")}
                  style={{ background: "none", border: "none", color: "#9ca3af", cursor: "pointer", fontSize: 13 }}>← חזרה</button>
              </div>
            </div>
          </div>
        );
      }

      /* ═══ SUMMARY ═══ */
      if (view === "summary" && participant) {
        const reg1 = getReg(participant.name, 1);
        const reg2 = getReg(participant.name, 2);
        const ws1 = reg1 ? workshops.find(w => w.id === reg1.workshopId) : null;
        const ws2 = reg2 ? workshops.find(w => w.id === reg2.workshopId) : null;
        const isLong = ws1 && ws1.isLong;

        const RoundCard = ({ label, ws, round, accent }) => ws ? (
          <div style={{ marginBottom: 14, borderRadius: 14, overflow: "hidden", border: ("2px solid " + accent + "30"), boxShadow: ("0 4px 16px " + accent + "12") }}>
            <div style={{ background: "linear-gradient(135deg, " + accent + "18, " + accent + "08)", padding: "10px 16px 8px" }}>
              <span style={{ fontSize: 12, fontWeight: 700, color: accent }}>{label}</span>
            </div>
            <div style={{ background: "#fff", padding: "14px 16px" }}>
              <div style={{ ...S.pill(getColor(ws.name) + "18", getColor(ws.name)), fontSize: 11, display: "inline-block", marginBottom: 8 }}>{ws.name}</div>
              <h3 style={{ margin: "0 0 4px", fontSize: 17, fontWeight: 800, color: "#1f2937" }}>{ws.facilitator}</h3>
              <p style={{ margin: 0, color: "#6b7280", fontSize: 13 }}>📍 {ws.location}</p>
            </div>
          </div>
        ) : (
          <div onClick={() => setView("round" + round)} style={{
            marginBottom: 14, borderRadius: 14, border: "2.5px dashed #e5e7eb",
            padding: "20px 16px", textAlign: "center", cursor: "pointer", background: "#fafafa"
          }}>
            <p style={{ margin: 0, color: "#9ca3af", fontSize: 14 }}>טרם נרשמת לסבב {round === 1 ? "א׳" : "ב׳"} — לחץ להרשמה</p>
          </div>
        );

        return (
          <div style={S.root}>
            <Toast />
            <div style={S.header()}>
              <div style={{ fontSize: 46, marginBottom: 4 }}>✅</div>
              <h2 style={{ margin: 0, fontSize: 22, fontWeight: 900 }}>ההרשמה שלך</h2>
              <p style={{ margin: "6px 0 0", opacity: .85, fontSize: 14 }}>{participant.name}</p>
            </div>
            <div style={S.wrap}>
              <RoundCard label={isLong ? "סבב א׳ + ב׳ (סדנא ארוכה)" : "סבב א׳"} ws={ws1} round={1} accent="#6850F0" />
              {!isLong && <RoundCard label="סבב ב׳" ws={ws2} round={2} accent="#38B6E0" />}
              <button onClick={() => setView("round1")}
                style={{ ...S.btn("#fff", "#374151"), border: "2px solid #e5e7eb", marginTop: 8 }}>
                שינוי בחירה
              </button>
              <div style={{ textAlign: "center", marginTop: 14 }}>
                <button onClick={() => { setParticipant(null); setFirstName(""); setLastName(""); setView("entry"); }}
                  style={{ background: "none", border: "none", color: "#9ca3af", cursor: "pointer", fontSize: 13 }}>יציאה</button>
              </div>
            </div>
          </div>
        );
      }

      /* ═══ ADMIN ═══ */
      if (view === "admin") {
        const uniquePart = [...new Set(registrations.map(r => r.participantName))].length;

        return (
          <div style={S.root}>
            <Toast />
            <div style={S.header("linear-gradient(135deg,#1e1b4b,#312e81)")}>
              <h2 style={{ margin: 0, fontSize: 22, fontWeight: 900 }}>🛠 פאנל מנהל</h2>
              <p style={{ margin: "6px 0 0", opacity: .7, fontSize: 13 }}>
                {registrations.length} הרשמות · {uniquePart} משתתפים · {workshops.length} סדנאות
              </p>
            </div>

            <div style={{ ...S.wrap, maxWidth: 860 }}>
              <div style={{ display: "flex", gap: 10, marginBottom: 22 }}>
                {[["report","📊 דוח הרשמות"],["manage","⚙️ ניהול סדנאות"]].map(([t,l]) => (
                  <button key={t} onClick={() => setAdminTab(t)} style={{
                    flex: 1, padding: "13px", borderRadius: 12, border: "none", cursor: "pointer",
                    fontWeight: 700, fontSize: 14,
                    background: adminTab === t ? "linear-gradient(135deg,#1e1b4b,#312e81)" : "#fff",
                    color: adminTab === t ? "#fff" : "#374151",
                    boxShadow: "0 2px 10px rgba(0,0,0,.07)",
                  }}>{l}</button>
                ))}
              </div>

              {adminTab === "report" && (
                <div>
                  <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap" }}>
                    <button onClick={exportCSV} style={{ ...S.btn("#10b981"), flex: "0 0 auto", width: "auto", padding: "11px 22px" }}>⬇ ייצוא CSV</button>
                    <button onClick={resetAll} style={{ ...S.btn("#ef4444"), flex: "0 0 auto", width: "auto", padding: "11px 22px" }}>🗑 מחיקת הרשמות</button>
                  </div>

                  {[1, 2].map(round => (
                    <div key={round} style={{ marginBottom: 28 }}>
                      <h3 style={{ margin: "0 0 12px", color: "#1e1b4b", fontSize: 17, fontWeight: 800 }}>סבב {round === 1 ? "א׳" : "ב׳"}</h3>
                      {workshops.filter(w => w.round === round).map(ws => {
                        const wRegs = registrations.filter(r => r.workshopId === ws.id);
                        const pct = Math.round((wRegs.length / ws.capacity) * 100);
                        const isExp = expanded === ws.id;
                        const color = getColor(ws.name);
                        return (
                          <div key={ws.id} style={{ marginBottom: 10, borderRadius: 14, border: "2px solid #eaeafe", overflow: "hidden", background: "#fff" }}>
                            <div onClick={() => setExpanded(isExp ? null : ws.id)}
                              style={{ padding: "14px 16px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                              <div>
                                <span style={{ fontWeight: 700, fontSize: 15, color: "#1f2937" }}>{ws.name}</span>
                                <span style={{ color: "#9ca3af", fontSize: 13, marginRight: 8 }}>{ws.facilitator}</span>
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={S.pill(pct >= 100 ? "#fee2e2" : pct >= 70 ? "#fef3c7" : "#d1fae5", pct >= 100 ? "#dc2626" : pct >= 70 ? "#92400e" : "#065f46")}>
                                  {wRegs.length}/{ws.capacity}
                                </span>
                                <span style={{ color: "#a3a3ff" }}>{isExp ? "▲" : "▼"}</span>
                              </div>
                            </div>
                            <div style={{ background: "#f3f4f6", height: 4 }}>
                              <div style={{ background: color, height: 4, width: Math.min(pct,100) + "%" }} />
                            </div>
                            {isExp && (
                              <div style={{ padding: "12px 16px", borderTop: "1px solid #f3f4f6" }}>
                                {!wRegs.length
                                  ? <p style={{ margin: 0, color: "#9ca3af", fontSize: 14 }}>אין משתתפים רשומים</p>
                                  : <ol style={{ margin: 0, paddingRight: 20 }}>
                                      {wRegs.map((r,i) => (
                                        <li key={i} style={{ padding: "3px 0", color: "#374151", fontSize: 14 }}>{r.participantName}</li>
                                      ))}
                                    </ol>
                                }
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              )}

              {adminTab === "manage" && (
                <div>
                  {workshops.map(ws => {
                    const isEdit = editing && editing.id === ws.id;
                    const color = getColor(ws.name);
                    return (
                      <div key={ws.id} style={{ marginBottom: 12, borderRadius: 14, border: "2px solid #eaeafe", background: "#fff", overflow: "hidden" }}>
                        <div style={{ background: color + "10", height: 4 }} />
                        <div style={{ padding: "14px 16px" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                            <div>
                              <div style={{ display: "flex", gap: 8, marginBottom: 4, alignItems: "center", flexWrap: "wrap" }}>
                                <span style={S.pill(color + "18", color)}>{ws.name}</span>
                                <span style={{ ...S.pill("#eaeafe","#6850F0"), fontSize: 11 }}>סבב {ws.round === 1 ? "א׳" : "ב׳"}{ws.isLong ? " ⏱" : ""}</span>
                              </div>
                              <h4 style={{ margin: "0 0 2px", fontWeight: 700, color: "#1f2937" }}>{ws.facilitator}</h4>
                              {!isEdit && (
                                <p style={{ margin: 0, color: "#6b7280", fontSize: 13 }}>
                                  📍 {ws.location} · 👥 מכסה {ws.capacity} · ✅ {getCount(ws.id)} רשומים
                                </p>
                              )}
                            </div>
                            <button onClick={() => isEdit ? setEditing(null) : setEditing({ ...ws })}
                              style={{ padding: "8px 16px", borderRadius: 10, border: "2px solid #e5e7eb", background: isEdit ? "#f3f4f6" : "#fff", cursor: "pointer", fontWeight: 600, fontSize: 13, flexShrink: 0 }}>
                              {isEdit ? "ביטול" : "עריכה"}
                            </button>
                          </div>

                          {isEdit && (
                            <div style={{ marginTop: 16, paddingTop: 14, borderTop: "2px solid #f3f4f6" }}>
                              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                                <div>
                                  <label style={S.label}>שם הקהילה</label>
                                  <input value={editing.name}
                                    onChange={e => setEditing({ ...editing, name: e.target.value })}
                                    style={{ ...S.input, padding: "10px 14px", fontSize: 14 }}
                                    placeholder="שם הקהילה" />
                                </div>
                                <div>
                                  <label style={S.label}>מנחה / תוצר</label>
                                  <input value={editing.facilitator}
                                    onChange={e => setEditing({ ...editing, facilitator: e.target.value })}
                                    style={{ ...S.input, padding: "10px 14px", fontSize: 14 }}
                                    placeholder="שם המנחה" />
                                </div>
                              </div>
                              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                                <div>
                                  <label style={S.label}>מכסה</label>
                                  <input type="number" value={editing.capacity}
                                    onChange={e => setEditing({ ...editing, capacity: parseInt(e.target.value)||0 })}
                                    style={{ ...S.input, padding: "10px 14px", fontSize: 14 }} />
                                </div>
                                <div>
                                  <label style={S.label}>מיקום / חדר</label>
                                  <input value={editing.location}
                                    onChange={e => setEditing({ ...editing, location: e.target.value })}
                                    style={{ ...S.input, padding: "10px 14px", fontSize: 14 }} placeholder="חדר / מיקום" />
                                </div>
                              </div>
                              <div style={{ marginBottom: 14 }}>
                                <label style={S.label}>תיאור (אופציונלי)</label>
                                <textarea value={editing.description}
                                  onChange={e => setEditing({ ...editing, description: e.target.value })}
                                  style={{ ...S.input, minHeight: 60, resize: "vertical", padding: "10px 14px", fontSize: 14 }}
                                  placeholder="תיאור קצר של הסדנא…" />
                              </div>
                              <button onClick={() => saveWorkshop(editing)}
                                style={{ ...S.btn("linear-gradient(135deg," + color + "," + color + "bb)"), width: "auto", padding: "11px 28px" }}>
                                שמור שינויים
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              <div style={{ textAlign: "center", marginTop: 28 }}>
                <button onClick={() => { setView("entry"); setAdminPass(""); }}
                  style={{ background: "none", border: "none", color: "#9ca3af", cursor: "pointer", fontSize: 13 }}>← יציאה מפאנל המנהל</button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
